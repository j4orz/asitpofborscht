[build]
# The sitp toolchain is pinned by aquascope: sitp/vendor/aquascope is a
# submodule, and sitp/rust-toolchain.toml is a symlink into it. Read the
# channel out of that file rather than repeating it here, so bumping the
# submodule is the only edit a toolchain upgrade needs.
command = '''
set -euo pipefail

TOOLCHAIN=$(grep -m1 "^channel" sitp/rust-toolchain.toml 2>/dev/null | cut -d\" -f2) || TOOLCHAIN=""
if [ -z "$TOOLCHAIN" ]; then
  echo "netlify: could not read channel from sitp/rust-toolchain.toml" >&2
  echo "netlify: is the sitp/vendor/aquascope submodule initialized?" >&2
  exit 1
fi
echo "netlify: sitp toolchain is $TOOLCHAIN"

# Bare `rustup toolchain install` installs the active toolchain, which
# inside sitp/ means the channel and components from rust-toolchain.toml.
(cd sitp && rustup toolchain install --no-self-update)

# The mdbook preprocessors build against the default stable toolchain;
# only aquascope_front needs the rustc-dev nightly that sitp is pinned to.
cargo install mdbook --version 0.5.2 --locked
cargo install mdbook-katex --git https://github.com/lzanini/mdbook-katex
cargo install mdbook-aquascope --locked
cargo install mdbook-quiz --locked
cargo "+$TOOLCHAIN" install aquascope_front --git https://github.com/cognitive-engineering-lab/aquascope --tag v0.4.0

curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
export PATH="$HOME/.elan/bin:$PATH"

cd sitp && mdbook build
'''
publish = "sitp/book"

# Same-origin passthrough for the doc hover previews in theme/js/custom.js.
# Those previews fetch a doc page and lift out its signature + summary, which
# needs the page to be readable by script. numpy.org sends
# `access-control-allow-origin: *` and is fetched directly; matplotlib.org sends
# no CORS header at all, so the browser refuses to hand its body to script. This
# proxy makes that fetch same-origin, which sidesteps CORS entirely. It carries
# preview fetches only — the links in the book still point at matplotlib.org.
[[redirects]]
from = "/docs-proxy/matplotlib/*"
to = "https://matplotlib.org/:splat"
status = 200
force = true
