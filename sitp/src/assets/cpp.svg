<!-- The ISO C++ logo, by Jeremy Kratz, CC BY-SA 4.0 (github.com/isocpp/logos).
     Flattened to one stencil: the upstream art is a hexagon tiled out of three
     shades of blue with the "C" and the two "+" laid over it in white, and here
     the hexagon's outline plus those three glyphs share a single `evenodd` path,
     so the letters are holes rather than white fill. That makes the file an
     alpha silhouette, which is what `.cppnote` masks to paint the mark in
     currentColor (see "Language notes" in theme/css/custom.css) — and why
     there is no `_dark` twin here the way the drawn .png figures need one. The
     brand blue is dropped on purpose: the margin is uniformly muted gray. -->
