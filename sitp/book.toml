[book]
authors = ["j4orz"]
language = "en"
src = "src"
title = "The Structure and Interpretation of Tensor Programs"

# `mdbook serve` watches src/, the theme, and book.toml by default. Notebooks
# embedded via {{#nb}} live outside src/, so list notebooks/ here to make a
# re-executed .ipynb trigger a rebuild/live-reload.
[build]
extra-watch-dirs = ["notebooks"]

[preprocessor.aquascope]

[preprocessor.katex]
after = ["links"]
# `trust` enables KaTeX's \html* extensions. Used for \htmlClass, which is the
# only way to color-code symbols in math *by CSS class* rather than by baked-in
# hex: \textcolor emits an inline `color:` that no dark-theme rule can override.
# See the .okabe-* classes in theme/css/custom.css.
trust = true
macros = "katex_macros.txt"

[output.html]
additional-css = ["theme/css/custom.css", "theme/css/lean.css"]
additional-js = ["theme/js/highlight-lean.min.js", "theme/js/custom.js", "theme/js/lean.js"]
default-theme = "light"
preferred-dark-theme = "ayu"

# Embeds committed, already-executed Jupyter notebooks as static In[]/Out[]
# cells via `{{#nb file.ipynb}}` / `{{#nb file.ipynb:tag}}`. Replaced the old
# Pyodide REPL. Add `hl=3-5,8` to a directive to band those source lines of the
# In[] box, so prose can point at them; the emphasis lives in the directive, not
# the notebook, so one cell can be highlighted differently at each embed.
# Notebooks live under `nb-dir`; styling in theme/css/custom.css
# (`.nb-*`, and `--nb-code-lh` / `--nb-hl-bg` for the bands). Re-execute + commit
# after editing code:
#   jupyter nbconvert --to notebook --execute --inplace notebooks/<file>.ipynb
[preprocessor.nb]
command = "python3 preprocessors/mdbook-nb"
nb-dir = "notebooks"
# Filename labels link here (directive path appended), so a reader can open the
# executed notebook itself.
src-url = "https://github.com/j4orz/asitpofborscht/blob/master/sitp/notebooks/"

[preprocessor.quiz]

# Links the successive (vaguer -> preciser) definitions of one concept into a
# ladder the reader can step through. Tag each occurrence with the same key —
# `<span class="defnote" data-refine="conditional-distribution">…</span>` or
# `<div class="definition" data-refine="probability-law" …>` — and a dot ladder
# is injected into every rung. See preprocessors/mdbook-refine; styling is in
# theme/css/custom.css (`.refine-*`).
[preprocessor.refine]
command = "python3 preprocessors/mdbook-refine"

# Renders type-checked Lean (via SubVerso) for `{{#lean Module.Name}}` directives.
# Examples live in `lean/SitpLean/`; see preprocessors/mdbook-lean.
# Identifiers/keywords link into the Lean reference via a pinned link table
# (preprocessors/lean-reference-links.json, reference v4.31.0). Regenerate after
# a toolchain bump: python3 preprocessors/gen-lean-reference-links.py <version>
[preprocessor.lean]
command = "python3 preprocessors/mdbook-lean"
lean-dir = "lean"
lib = "SitpLean"
build = true
reference-links = "preprocessors/lean-reference-links.json"